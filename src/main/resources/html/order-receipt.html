<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        [[styleContent]]
    </style>
</head>
<body style="background-color: #f4f6f9; margin: 0; padding: 0;">
<table class="email-wrapper" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f6f9; padding: 30px 0;">
    <tr>
        <td align="center">
            <div class="container">
                <div class="header">
                    <h2>FLEX GYM</h2>
                    <p>Official Order Receipt</p>
                </div>
                <div class="content">
                    <p>Hello <b>[[memberName]]</b>,</p>
                    <p>Thank you for your purchase! Your order has been successfully placed.</p>
                    <p><b>Order ID:</b> #[[orderId]]</p>

                    <table>
                        <tr>
                            <th>Item Name</th>
                            <th>Qty</th>
                            <th>Unit Price</th>
                        </tr>
                        [[tableRows]]
                    </table>

                    <div class="total">Total Amount: Rs. [[totalAmount]]</div>
                </div>
                <div class="footer">
                    <p>Stay fit with Flex Gym! &copy; 2026 All Rights Reserved.</p>
                </div>
            </div>
        </td>
    </tr>
</table>
</body>
</html>
